# DeployGuard Bundle Stats — generated automatically
# Vite projects detected. Do not edit this file manually.
name: DeployGuard Bundle Stats

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Generate DeployGuard stats
        run: |
          node - << 'EOF'
          const fs   = require('fs');
          const path  = require('path');
          const distDir = './dist/assets';
          const files = fs.existsSync(distDir)
            ? fs.readdirSync(distDir).map(f => ({
                name: f,
                size: fs.statSync(path.join(distDir, f)).size,
              }))
            : [];
          fs.mkdirSync('./dist', { recursive: true });
          fs.writeFileSync('./dist/stats.json', JSON.stringify({ format: 'vite', assets: files }, null, 2));
          EOF

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: dist/
          retention-days: 7
